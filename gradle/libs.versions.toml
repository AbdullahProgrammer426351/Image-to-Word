[versions]
agp = "9.2.1"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.10.0"
composeBom = "2026.02.01"
navigationCompose = "2.9.0"
datastore = "1.1.7"
reorderable = "0.9.6"
room = "2.8.2"
coroutinesPlayServices = "1.10.2"
coil = "2.7.0"
lottie = "6.6.10"
playServicesAds = "24.7.0"
billing = "7.1.1"
ucropVersion = "2.2.8"
ump = "3.2.0"
firebaseCrashlytics = "20.0.5"
firebaseAuth = "24.0.1"
firebaseConfig = "23.0.1"
googleGmsGoogleServices = "4.4.4"
googleFirebaseCrashlytics = "3.0.7"
mlkitTextRecognition = "16.0.1"
mlkitBarcodeScanning = "17.3.0"
skydovesColorPicker = "1.1.4"


junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
playServicesMlkitTextRecognitionCommon = "19.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

# Third-party: Firebase Crashlytics SDK
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }
# Third-party: Firebase Auth SDK
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
# Third-party: Firebase Remote Config SDK
firebase-config = { group = "com.google.firebase", name = "firebase-config", version.ref = "firebaseConfig" }
# Third-party: Kotlin coroutines bridge for Google Play Services Tasks
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
# Third-party: Coil image loading for Compose
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# Third-party: Coil SVG decoder
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }
# Third-party: Google Mobile Ads SDK
google-play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
# Third-party: Google Play Billing SDK
google-play-billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
# Third-party: Google User Messaging Platform (consent SDK)
google-ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
# Third-party: Airbnb Lottie for Compose
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
# Third-party: ML Kit on-device text recognition
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
# Third-party: ML Kit barcode / QR scanning
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcodeScanning" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
play-services-mlkit-text-recognition-common = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-common", version.ref = "playServicesMlkitTextRecognitionCommon" }
reorderable = { module = "org.burnoutcrew.composereorderable:reorderable", version.ref = "reorderable" }
yalantis-ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucropVersion" }
skydoves-colorpicker-compose = { group = "com.github.skydoves", name = "colorpicker-compose", version.ref = "skydovesColorPicker" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "googleFirebaseCrashlytics" }
